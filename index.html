<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<meta name="robots" content="noindex,nofollow,noarchive"/>
<meta name="referrer" content="no-referrer"/>
<title>Портфель-дозор</title>
<style>
:root{
  --bg:#0b1020; --card:#121a36; --card2:#0f1730; --line:#1e2b50;
  --txt:#e8edff; --mut:#8a97c2; --mut2:#5d6a96;
  --up:#3fb950; --down:#f85149; --accent:#f5a524; --teal:#34d3c2;
}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--txt);
  font-family:'Segoe UI',system-ui,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 40px}
a{color:var(--teal)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.title{font-size:26px;font-weight:800;letter-spacing:.3px}
.title .dot{color:var(--accent)}
.sub{color:var(--mut);font-size:13px;margin-top:4px}
.badge{font-size:12px;color:var(--mut);background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:6px 12px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(4,1fr)}
.two{grid-template-columns:1.05fr .95fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;position:relative;overflow:hidden}
.card h3{margin:0 0 2px;font-size:14px;font-weight:700}
.card .cap{color:var(--mut2);font-size:12px;margin-bottom:12px}
.kpi .lbl{color:var(--mut);font-size:12.5px}
.kpi .big{font-size:30px;font-weight:800;margin-top:6px;line-height:1.05}
.kpi .big small{font-size:14px;font-weight:600;color:var(--mut2)}
.kpi .sub2{font-size:12.5px;color:var(--mut2);margin-top:6px}
.kpi .stripe{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:4px}
.pos{color:var(--up)} .neg{color:var(--down)}
.rowbars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:132px 1fr 96px;align-items:center;gap:10px;font-size:12.5px}
.bar .nm{color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .track{background:var(--card2);border-radius:7px;height:20px;position:relative;overflow:hidden}
.bar .fill{position:absolute;top:0;bottom:0;border-radius:7px}
.bar .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.legend{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.legend .li{display:grid;grid-template-columns:12px 1fr auto auto;align-items:center;gap:9px;font-size:12.5px}
.legend .sw{width:11px;height:11px;border-radius:3px}
.legend .lp{color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend .lv{color:var(--mut2);font-variant-numeric:tabular-nums}
.legend .lpct{font-weight:700;font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:9px 8px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th{color:var(--mut2);font-weight:600;border-bottom:1px solid var(--line);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px}
td{border-bottom:1px solid rgba(30,43,80,.5)}
th.l,td.l{text-align:left}
tr:last-child td{border-bottom:none}
.tag{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:7px;vertical-align:middle}
.muted{color:var(--mut)}
.reinvest{border:1px solid #3a3016;background:linear-gradient(180deg,#1c1710,#141021)}
.reinvest .amt{font-size:26px;font-weight:800;color:var(--accent)}
.clist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.clist .ci{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;font-size:12.5px;
  padding:8px 10px;background:var(--card2);border-radius:9px}
.clist .cd{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.clist .cc{font-weight:700;font-variant-numeric:tabular-nums}
.ev{display:flex;gap:10px;align-items:baseline;font-size:13px;padding:7px 0;border-bottom:1px solid rgba(30,43,80,.5)}
.ev:last-child{border-bottom:none}
.ev .d{color:var(--accent);font-weight:700;white-space:nowrap}
.alert{border:1px solid #5a1e1e;background:linear-gradient(180deg,#241014,#141021)}
.alert .a{font-size:13px;padding:4px 0;color:#ffb4b4}
.sec-title{font-size:12px;color:var(--mut2);text-transform:uppercase;letter-spacing:.6px;margin:26px 2px 10px}
.foot{color:var(--mut2);font-size:11.5px;margin-top:26px;text-align:center;line-height:1.7}
.pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mut)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media(max-width:860px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .two{grid-template-columns:1fr}
  .bar{grid-template-columns:112px 1fr 84px}
  .title{font-size:22px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <div class="title">Портфель<span class="dot">·</span>дозор</div>
      <div class="sub" id="sub"></div>
    </div>
    <div class="badge" id="asof"></div>
  </div>

  <div id="alerts"></div>

  <div class="grid kpis" id="kpis"></div>

  <div class="grid two" style="margin-top:14px">
    <div class="card">
      <h3>Распределение по позициям</h3>
      <div class="cap">доля в оценке счёта</div>
      <div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
        <div id="donut"></div>
        <div class="legend" id="legend" style="flex:1;min-width:220px"></div>
      </div>
    </div>
    <div class="card">
      <h3>P&amp;L по позициям</h3>
      <div class="cap">переоценка к цене входа, ₽</div>
      <div class="rowbars" id="pnlbars"></div>
    </div>
  </div>

  <div class="grid two" style="margin-top:14px">
    <div class="card">
      <h3>Лесенка погашений</h3>
      <div class="cap">облигации по дате погашения · размер = оценка позиции</div>
      <div class="rowbars" id="ladder"></div>
    </div>
    <div class="card reinvest" id="reinvest-card">
      <h3>💰 К реинвесту</h3>
      <div class="cap" id="reinvest-cap"></div>
      <div class="amt" id="reinvest-amt"></div>
      <div class="clist" id="reinvest-list"></div>
    </div>
  </div>

  <div class="sec-title">Позиции счёта</div>
  <div class="card" style="padding:8px 10px">
    <div class="scroll"><table id="postbl"></table></div>
  </div>

  <div class="grid two" style="margin-top:14px">
    <div class="card">
      <h3>Ближайшие купоны</h3>
      <div class="cap">поступления денег в счёт</div>
      <div class="clist" id="coupons"></div>
    </div>
    <div class="card">
      <h3>👀 Наблюдение</h3>
      <div class="cap">не входит в итог по счёту</div>
      <div class="scroll"><table id="watchtbl"></table></div>
      <div id="events-wrap" style="margin-top:14px"></div>
    </div>
  </div>

  <div class="foot" id="foot"></div>
</div>

function fi(n){ if(n===null||n===undefined||isNaN(n)) return "—";

  const mx=Math.max(1,...B.map(p=>p.value_now||0));
  const box=document.getElementById("ladder");
  if(!B.length){ box.innerHTML='<div class="muted">нет облигаций</div>'; return; }
  B.forEach(p=>{
    const w=(p.value_now||0)/mx*100;
    const yr=p.maturity.slice(0,4);
    const bar='<div class="track"><div class="fill" style="left:0;width:'+w+'%;background:'+p.color+
      ';opacity:.9"></div><span style="position:absolute;left:8px;top:2px;font-size:11px;color:#0b1020;font-weight:700">'+
      f1(p.ytm)+'%</span></div>';
    box.appendChild(el('<div class="bar"><span class="nm">'+esc(p.name)+' · '+yr+'</span>'+bar+
      '<span class="val">'+fi(p.value_now)+' ₽</span></div>'));
  });
})();
